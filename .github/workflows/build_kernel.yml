name: Build crDroid Kernel for Xiaomi Jason

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex \
          git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python3 python3-pip python-is-python3

    - name: Set up Clang Toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b android-13.0.0_r1 clang
        export CLANG_PATH=$(pwd)/clang/clang-r450784d/bin
        export PATH=$CLANG_PATH:$PATH
        export ARCH=arm64
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-

    - name: Configure Kernel
      run: |
        make ARCH=arm64 O=out jason_defconfig
        
        # 禁用不支持的配置
        ./scripts/config --file out/.config \
          --disable CONFIG_CC_STACKPROTECTOR_STRONG \
          --disable CONFIG_ARM64_ERRATUM_843419
        
        make ARCH=arm64 O=out olddefconfig

    - name: Build Kernel
      run: |
        make ARCH=arm64 O=out -j$(nproc --all) CC=clang 2>&1 | tee build.log

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-output
        path: |
          out/arch/arm64/boot/Image*
          build.log
