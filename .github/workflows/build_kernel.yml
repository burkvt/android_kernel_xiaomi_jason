name: Build crDroid Kernel for Xiaomi Jason

on:
  workflow_dispatch:  # 手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 确保拉取子模块

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex gcc-aarch64-linux-gnu \
          git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool \
          libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
          lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
          python python3

    - name: Set up AOSP GCC Toolchain
      run: |
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-11.0.0_r48 toolchain
        export PATH=$(pwd)/toolchain/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export KBUILD_BUILD_USER=github-ci
        export KBUILD_BUILD_HOST=gh-actions

    - name: Configure Kernel (Jason defconfig)
      run: |
        make O=out jasmine-perf_defconfig  # 使用设备专用 defconfig

    - name: Build Kernel
      run: |
        make O=out -j$(nproc --all) 2>&1 | tee build.log

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v3
      with:
        name: jason-kernel-image
        path: out/arch/arm64/boot/Image.gz-dtb  # 确认输出路径

    - name: Upload Build Log (Debug)
      uses: actions/upload-artifact@v3
      if: ${{ always() }}
      with:
        name: build-log
        path: build.log
